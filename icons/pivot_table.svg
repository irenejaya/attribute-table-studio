<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Pivot Table</title>
  <desc>A pivot grid with row headers and a summary symbol: grouped summaries.</desc>

  <!-- table body -->
  <rect x="5" y="8" width="54" height="48" rx="4" fill="#FFFFFF"/>
  <!-- row header column -->
  <path d="M5 20h17v36H9a4 4 0 0 1-4-4Z" fill="#BFDBFE"/>
  <!-- summary cell -->
  <path d="M30 35h29v17a4 4 0 0 1-4 4H30Z" fill="#DBEAFE"/>
  <!-- header band -->
  <path d="M9 8h46a4 4 0 0 1 4 4v8H5v-8a4 4 0 0 1 4-4Z" fill="#3B82F6"/>
  <!-- grid -->
  <path d="M5 35h54M22 20v36M30 35v21" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- sigma -->
  <path d="M54 39.5H36l8 6.5-8 6.5h18" fill="none" stroke="#1E3A8A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- outline -->
  <rect x="5" y="8" width="54" height="48" rx="4" fill="none" stroke="#475569" stroke-width="2.5"/>
</svg>

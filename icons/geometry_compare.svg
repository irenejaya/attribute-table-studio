<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Geometry and Table Compare</title>
  <desc>Compare an old attribute table with a new one. Red minus: removed features. Green plus: added features. Amber cell: modified value.</desc>

  <!-- OLD table -->
  <rect x="3" y="9" width="23" height="46" rx="3" fill="#FFFFFF"/>
  <path d="M6 9h17a3 3 0 0 1 3 3v8H3v-8a3 3 0 0 1 3-3Z" fill="#64748B"/>
  <path d="M3 43h23v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z" fill="#E5484D"/>
  <path d="M3 20h23M3 31h23M11 20v23" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M7 25.5h.1M7 37h.1M15 25.5h6.5M15 37h6.5" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M11 49h7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="3" y="9" width="23" height="46" rx="3" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- NEW table: a changed field and an added feature -->
  <rect x="38" y="9" width="23" height="46" rx="3" fill="#FFFFFF"/>
  <path d="M41 9h17a3 3 0 0 1 3 3v8H38v-8a3 3 0 0 1 3-3Z" fill="#3B82F6"/>
  <path d="M46 31h15v12H46Z" fill="#FBBF24"/>
  <path d="M38 43h23v9a3 3 0 0 1-3 3H41a3 3 0 0 1-3-3Z" fill="#22A866"/>
  <path d="M38 20h23M38 31h23M46 20v23" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M42 25.5h.1M42 37h.1M50 25.5h6.5" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 37h6.5" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 49h7M49.5 45.5v7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="38" y="9" width="23" height="46" rx="3" fill="none" stroke="#475569" stroke-width="2.5"/>

  <!-- Direction of comparison: OLD to NEW -->
  <path d="M28.5 30.75H32v-3.5L37 32l-5 4.75v-3.5h-3.5Z" fill="#3B82F6"/>
</svg>
